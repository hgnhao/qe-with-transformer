[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for an IR system with Transformer-based query expansion over the CISI corpus"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "nltk>=3.9.4",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.30",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.5.1",
    "uvicorn>=0.48.0",
]
